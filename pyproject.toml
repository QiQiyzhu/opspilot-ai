[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "1.0.0"
description = "Simulated business RAG and audited operations agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "redis>=6,<8", "httpx>=0.28,<1", "mcp==2.2.0", "fastembed>=0.7,<1",
  "beautifulsoup4>=4.13,<5", "rank-bm25>=0.2.2,<1", "numpy>=2,<3",
  "python-multipart>=0.0.20", "opentelemetry-api>=1.30,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "evals*", "analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
